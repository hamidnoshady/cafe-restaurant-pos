name: release-readiness

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version whose external evidence must match'
        type: string
        required: true
      candidate_commit:
        description: 'Full release-candidate Git commit SHA'
        type: string
        required: true
      candidate_installer_sha256:
        description: 'Exact signed candidate installer SHA-256; required for artifact-bound production evidence'
        type: string
        required: false
      production_gate:
        description: 'Fail unless every production requirement is PASS'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  readiness:
    name: release readiness states
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Materialize configured acceptance evidence
        env:
          EVIDENCE: ${{ vars.RELEASE_ACCEPTANCE_EVIDENCE_JSON }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          INSTALLER_SHA256: ${{ inputs.candidate_installer_sha256 }}
          PRODUCTION_GATE: ${{ inputs.production_gate }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "version must be a release version" }
          if ($env:CANDIDATE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw "candidate_commit must be a full Git SHA" }
          if ($env:WORKFLOW_COMMIT -cne $env:CANDIDATE_COMMIT) { throw "Workflow definition commit $env:WORKFLOW_COMMIT does not match candidate $env:CANDIDATE_COMMIT" }
          if (-not [string]::IsNullOrWhiteSpace($env:INSTALLER_SHA256) -and $env:INSTALLER_SHA256 -notmatch '^[0-9a-f]{64}$') { throw "candidate_installer_sha256 must be a lowercase SHA-256" }
          if ($env:PRODUCTION_GATE -eq 'true' -and [string]::IsNullOrWhiteSpace($env:INSTALLER_SHA256)) { throw "candidate_installer_sha256 is required for the production gate" }
          if ([string]::IsNullOrWhiteSpace($env:EVIDENCE)) {
            '{"schemaVersion":1,"checks":{}}' | Set-Content release-evidence.json -Encoding UTF8
            Write-Host "::warning title=Readiness NOT CONFIGURED::RELEASE_ACCEPTANCE_EVIDENCE_JSON is unset. The report will name each missing requirement and production will remain blocked."
          } else {
            $parsed = $env:EVIDENCE | ConvertFrom-Json
            $parsed | ConvertTo-Json -Depth 12 | Set-Content release-evidence.json -Encoding UTF8
          }

      - name: Generate PASS, FAIL, NOT CONFIGURED and MANUAL states
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          INSTALLER_SHA256: ${{ inputs.candidate_installer_sha256 }}
          PRODUCTION_GATE: ${{ inputs.production_gate }}
        run: |
          $arguments = @(
            'scripts/generate-release-readiness.mjs',
            '--evidence=release-evidence.json',
            '--output=release-readiness.json',
            '--markdown=release-readiness.md',
            "--commit=$env:CANDIDATE_COMMIT",
            "--version=$env:VERSION"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:INSTALLER_SHA256)) { $arguments += "--installer-sha256=$env:INSTALLER_SHA256" }
          if ($env:PRODUCTION_GATE -eq 'true') { $arguments += '--production' }
          & node @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish readiness summary
        if: always()
        run: |
          if (Test-Path release-readiness.md) { Get-Content release-readiness.md | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-${{ inputs.version }}
          if-no-files-found: error
          path: |
            release-evidence.json
            release-readiness.json
            release-readiness.md
