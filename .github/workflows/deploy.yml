name: CI and deploy

# Replaces the previous CircleCI pipeline. The test job is a direct port of
# .circleci/config.yml; the image job is new.
#
# The production server cannot clone from GitHub (its git links against
# libcurl-gnutls, whose TLS handshake to github.com is filtered upstream), so
# it never fetches source. Instead the image is built here and pushed to GHCR,
# and the server only does a `docker pull` — which works fine.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        # GitHub needs a healthcheck to know when to start the job steps;
        # CircleCI's config polled for this by hand instead.
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pos:pos@localhost:5432/pos
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run migrations
        run: npm run db:migrate
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  build-and-push:
    # Only publish from main and release tags — never from pull requests.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags to publish
        id: meta
        run: |
          # Always publish an immutable sha tag for rollbacks. Publish :latest
          # for both main and release tags, since the server tracks :latest.
          sha_tag="sha-$(git rev-parse --short HEAD)"
          tags="${IMAGE}:${sha_tag},${IMAGE}:latest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Layer cache in GHA storage keeps npm ci off the critical path.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This image carries the full dependency tree (npm start runs
      # `tsx server.ts`, so tsx/next ship at runtime), and GitHub Free only
      # allows 500 MB of private package storage. Without this, untagged
      # versions from every push pile up and fill the quota.
      - name: Prune old untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: cafe-restaurant-pos
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
        continue-on-error: true

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo redeploy and wait for the result
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          set -euo pipefail
          # Fail loudly rather than reporting a green deploy that never ran.
          if [ -z "${KOMODO_URL}" ] || [ -z "${KOMODO_KEY}" ] || [ -z "${KOMODO_SECRET}" ]; then
            echo "::error::Komodo deploy secrets are missing (KOMODO_URL / KOMODO_API_KEY / KOMODO_API_SECRET)."
            exit 1
          fi

          auth=(-H "X-Api-Key: ${KOMODO_KEY}" -H "X-Api-Secret: ${KOMODO_SECRET}"
                -H 'Content-Type: application/json')

          # DeployStack is asynchronous: this returns as soon as Komodo accepts
          # the request, long before the pull and `compose up` have finished.
          # Without polling, a failed deploy would still show a green job.
          update_id=$(curl -fsS --max-time 120 "${KOMODO_URL}/execute" "${auth[@]}" \
            -d '{"type":"DeployStack","params":{"stack":"pos"}}' | jq -r '.id')
          echo "Komodo update: ${update_id}"

          for _ in $(seq 1 120); do
            body=$(curl -fsS --max-time 60 "${KOMODO_URL}/read" "${auth[@]}" \
              -d "{\"type\":\"GetUpdate\",\"params\":{\"id\":\"${update_id}\"}}")

            if [ "$(printf '%s' "$body" | jq -r '.status // ""')" = "Complete" ]; then
              printf '%s' "$body" \
                | jq -r '.logs[]? | "--- \(.stage) (success=\(.success))", (.stderr // ""), (.stdout // "")'

              if [ "$(printf '%s' "$body" | jq -r '.success')" != "true" ]; then
                echo "::error::Komodo reported the deploy as failed."
                exit 1
              fi
              echo "Deploy complete."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for Komodo to finish the deploy."
          exit 1
