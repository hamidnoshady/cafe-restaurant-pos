# Builds and publishes the production GHCR image on every push to main, then
# asks Coolify to pull the new image and verifies the production rollout. A v*
# tag also publishes an immutable release tag without restarting production.
#
# Tag shape is load-bearing: main publishes `sha-<short>` plus `latest`,
# matching imageRefFor() in src/lib/app-update-status.ts; a v* ref additionally
# publishes its release name for POS_IMAGE_TAG pins. GIT_SHA is passed as a build
# arg because the Dockerfile bakes it into APP_IMAGE_SHA, which is how a running
# container knows which build it is.
#
# The pre-publish gates intentionally test the exact commit being published.
# They protect direct pushes, tags, and manual runs independently of PR checks.
#
# Runs on the self-hosted **Windows** runner. Two requirements follow, and both
# are verified by the `docker-publish` job before it does anything expensive:
#
#   * The image is a Linux image. Docker Desktop must therefore be running and
#     set to the **Linux containers** backend (WSL2). A Windows-containers
#     daemon cannot build this Dockerfile at all, so the job fails fast with
#     that instruction rather than part-way through a build.
#   * Every `run:` block is PowerShell, because a self-hosted Windows runner is
#     not guaranteed to have bash on PATH.
name: publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # Republish without a new commit (a rebuild after a base-image CVE, say).
  workflow_dispatch:

# Never cancel: a half-published image is worse than a slow queue, and two
# merges in a row must each produce their own tag.
concurrency:
  # Main and release-tag events write to the same package. Keep one global
  # queue so two refs cannot race a tag update or a production restart.
  group: publish-production
  cancel-in-progress: false

defaults:
  run:
    # Windows PowerShell 5.1 — always present on Windows, unlike `pwsh`.
    shell: powershell

env:
  NODE_OPTIONS: --max-old-space-size=3072
  # Session signing is not what's under test here, but the auth/webauthn
  # suites need a real (non-placeholder) secret and `next build` does not read
  # .env. Throwaway, CI-only, never used to sign anything real.
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef

jobs:
  gates:
    name: pre-publish gates
    runs-on: [self-hosted, windows, x64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker-publish:
    name: publish image (GHCR)
    runs-on: [self-hosted, windows, x64]
    needs: [gates]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile is `FROM node:20-alpine` — a Linux image. Building it
      # needs Docker Desktop up and switched to the Linux/WSL2 backend. Both
      # failures are silent until the build itself dies with a confusing error,
      # so they are checked here with an actionable message instead.
      - name: Check Docker is running with the Linux backend
        run: |
          $ErrorActionPreference = "Stop"
          try {
            $os = (docker version --format '{{.Server.Os}}' 2>&1 | Out-String).Trim()
          } catch {
            Write-Error "Docker is not reachable. Start Docker Desktop on this machine (and enable 'Start Docker Desktop when you log in') before publishing."
            exit 1
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker is not reachable. Start Docker Desktop on this machine before publishing. Output: $os"
            exit 1
          }
          if ($os -ne "linux") {
            Write-Error "Docker is in '$os' container mode. This Dockerfile builds a Linux image: right-click the Docker Desktop tray icon and choose 'Switch to Linux containers'."
            exit 1
          }
          Write-Host "Docker server OS: $os"

      - name: Compute short sha
        id: sha
        run: |
          # Windows PowerShell 5.1's `Out-File -Encoding utf8` writes a UTF-8
          # BOM, and the runner parses these files byte-for-byte: a BOM ends up
          # inside the first key name, so `steps.<id>.outputs.<key>` silently
          # resolves to empty. Append BOM-free bytes instead.
          function Add-GitHubOutput([string]$line) {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$line`n", (New-Object System.Text.UTF8Encoding($false)))
          }
          $short = "$env:GITHUB_SHA".Substring(0, 7)
          Add-GitHubOutput "short=$short"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
            NODE_OPTIONS=${{ env.NODE_OPTIONS }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Trigger Coolify redeploy
        if: github.ref_type == 'branch'
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          # `latest=true` is load-bearing for a Docker-image service: a plain
          # restart would recreate the old local image and report success.
          # Do not automatically retry this POST — Coolify may have queued the
          # restart before a response is lost, and a retry would cause the
          # duplicate restarts visible in the production logs.
          $ErrorActionPreference = "Stop"
          # TLS 1.2 is not the default in Windows PowerShell 5.1 and the API
          # refuses anything older.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://manage.eshobe.com/api/v1/services/jrfpvt0rctfkmzpw1ao5c1cb/restart?latest=true" `
            -Headers @{ Authorization = "Bearer $env:COOLIFY_API_TOKEN" } `
            -TimeoutSec 30 | Out-Null

      - name: Report an unverified production rollout
        if: github.ref_type == 'branch' && vars.PRODUCTION_HEALTH_URL == ''
        run: |
          Write-Host "::warning title=Production rollout unverified::Coolify accepted a redeploy request, but PRODUCTION_HEALTH_URL is unset so this run cannot prove the live image or canonical routes changed. Set it to https://<live-host>/api/health."

      - name: Verify the published image and canonical routes are live
        # Production verification is intentionally opt-in until the service's
        # public hostname has been stored as the non-secret repository variable
        # PRODUCTION_HEALTH_URL. A restart acknowledgement only says Coolify
        # queued work; it is not proof that the new image replaced the old one.
        #
        # Set the value to https://<live-host>/api/health. The verifier waits
        # for APP_IMAGE_SHA, then checks every route involved in the top-level
        # apps/settings cutover takes the canonical signed-out login redirect
        # (rather than 404ing or falling back to /dashboard/*).
        if: github.ref_type == 'branch' && vars.PRODUCTION_HEALTH_URL != ''
        timeout-minutes: 12
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.short }}
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          DEPLOY_VERIFY_ATTEMPTS: "60"
          DEPLOY_VERIFY_DELAY_MS: "10000"
        run: node scripts/verify-production-deploy.mjs
