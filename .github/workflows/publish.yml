# Builds the production image and publishes it to GHCR on every push to main.
# A v* tag also publishes an immutable release tag for pinned site installs,
# but does not restart production a second time.
#
# This is the one automatic workflow in the repo, and deliberately so: it is
# what deployment consumes. `test.yml` and `build-and-push.yml` stay manual
# (CLAUDE.md's CI section), because a checklist and a Docker Hub image are
# things you ask for; an image for the deploy target has to exist for every
# merge or the stack silently keeps running the previous one.
#
# Why GHCR, when build-and-push.yml pushes to Docker Hub. The rest of the
# product already assumed a GHCR image and nothing ever pushed one:
#   - docker-compose.local.yml (the café-server stack) pulls
#     ghcr.io/hamidnoshady/cafe-restaurant-pos:${POS_IMAGE_TAG:-latest};
#   - src/lib/app-update.ts defaults GHCR_IMAGE to that same repository and
#     mints short-lived GHCR pull tokens for the laptop self-update flow.
# Docker Hub was adopted because srv1 cannot reach ghcr.io at all — it is
# filtered at the network layer on that host. That is now solved the way the
# sibling eshobe-cms repo solved it: the srv1 stack pulls the same GHCR image
# through the ghcr-mirror.liara.ir pull-through cache, which is reachable
# (docker-compose.srv1.yml). build-and-push.yml is kept as-is for anyone still
# pulling the Docker Hub tag; it is not the deploy path.
#
# Tag shape is load-bearing: main publishes `sha-<short>` plus `latest`,
# matching imageRefFor() in src/lib/app-update-status.ts; a v* ref additionally
# publishes its release name for POS_IMAGE_TAG pins. A long-sha tag (the shape
# eshobe-cms uses) would leave the café laptop's update check looking for a tag
# that does not exist. GIT_SHA is passed as a build arg because the Dockerfile
# bakes it into APP_IMAGE_SHA, which is how a running container knows which
# build it is.
#
# The image is gated, not blind: `gates` re-runs the static half of the local
# checklist (type check, unit tests, production build) on the exact merge
# commit before anything is pushed. The database-backed integration suite
# stays in the manual test.yml — it needs a service container and several
# minutes, and the local checklist is what CLAUDE.md makes the real gate.
#
# NOTE: this does not by itself change what production runs. Runflare still
# builds from source per docs/server-migration.md until its service is
# repointed at this image — a separate, deliberate step.
name: publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # Republish without a new commit (a rebuild after a base-image CVE, say).
  workflow_dispatch:

# Never cancel: a half-published image is worse than a slow queue, and two
# merges in a row must each produce their own tag.
concurrency:
  # Main and release-tag events write to the same package. Keep one global
  # queue so two refs cannot race a tag update or a production restart.
  group: publish-production
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=3072
  # Session signing is not what's under test here, but the auth/webauthn
  # suites need a real (non-placeholder) secret and `next build` does not read
  # .env. Throwaway, CI-only, never used to sign anything real.
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef

jobs:
  gates:
    name: pre-publish gates
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker-publish:
    name: publish image (GHCR)
    runs-on: [self-hosted, linux, x64]
    needs: [gates]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
            NODE_OPTIONS=${{ env.NODE_OPTIONS }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Trigger Coolify redeploy
        if: github.ref_type == 'branch'
        run: |
          # `latest=true` is load-bearing for a Docker-image service: a plain
          # restart would recreate the old local image and report success.
          # Do not automatically retry this POST — Coolify may have queued the
          # restart before a response is lost, and a retry would cause the
          # duplicate restarts visible in the production logs.
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST \
            "https://manage.eshobe.com/api/v1/services/jrfpvt0rctfkmzpw1ao5c1cb/restart?latest=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

      - name: Report an unverified production rollout
        if: github.ref_type == 'branch' && vars.PRODUCTION_HEALTH_URL == ''
        run: |
          echo "::warning title=Production rollout unverified::Coolify accepted a redeploy request, but PRODUCTION_HEALTH_URL is unset so this run cannot prove the live image or canonical routes changed. Set it to https://<live-host>/api/health."

      - name: Verify the published image and canonical routes are live
        # Production verification is intentionally opt-in until the service's
        # public hostname has been stored as the non-secret repository variable
        # PRODUCTION_HEALTH_URL. A restart acknowledgement only says Coolify
        # queued work; it is not proof that the new image replaced the old one.
        #
        # Set the value to https://<live-host>/api/health. The verifier waits
        # for APP_IMAGE_SHA, then checks every route involved in the top-level
        # apps/settings cutover takes the canonical signed-out login redirect
        # (rather than 404ing or falling back to /dashboard/*).
        if: github.ref_type == 'branch' && vars.PRODUCTION_HEALTH_URL != ''
        timeout-minutes: 12
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.short }}
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          DEPLOY_VERIFY_ATTEMPTS: "60"
          DEPLOY_VERIFY_DELAY_MS: "10000"
        run: node scripts/verify-production-deploy.mjs
