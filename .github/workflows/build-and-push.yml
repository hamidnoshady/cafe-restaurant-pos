# Builds the production image and publishes it to (private) Docker Hub.
#
# Manual only: dispatch it from the Actions tab when you want an image. It
# does not run on push or after a merge to main, does not wait on test.yml,
# and pushing here does not trigger any redeploy.
#
# This is not the deploy path: production runs the GHCR image that
# publish.yml publishes automatically on every push to main, pulled through
# the ghcr-mirror.liara.ir pull-through cache — exactly like the sibling
# eshobe-cms repo. Docker Hub is no longer the deploy path; this workflow
# stays as a standalone option for anyone still pulling the Docker Hub tag.
#
# The package this pushes to is private
# (DOCKERHUB_USERNAME/cafe-restaurant-pos on Docker Hub, created private
# manually — Docker Hub auto-creates on first push as public otherwise),
# matching docs/server-sync.md ("this is a closed-source product"). Do not
# make it public, and do not switch this workflow to GHCR.
#
# Tag shape is load-bearing: `sha-<short>` plus `latest`, matching
# imageRefFor() in src/lib/app-update-status.ts. GIT_SHA is passed as a build
# arg because the Dockerfile bakes it into APP_IMAGE_SHA, which is how a
# running container knows which build it is.
name: build and push image

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cafe-restaurant-pos
  # Session signing is not what's under test here, but `next build` does not
  # read .env and needs a real (non-placeholder) secret to prerender.
  # Throwaway, CI-only, never used to sign anything real.
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef

jobs:
  build-and-push:
    name: build and push (Docker Hub)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
