# Builds the production image, publishes it to (private) Docker Hub, and triggers
# Coolify to redeploy production — on every push to main.
#
# This is the production deploy path, and deliberately automatic: it is what
# production (srv1, via Coolify) actually runs. While this workflow was
# manual-only, every merge sat undeployed until somebody dispatched it by hand,
# so production silently lagged main. An image for the deploy target has to
# exist for every merge, hence the `push` trigger; `workflow_dispatch` is kept
# so a rebuild can still be forced without a new commit (a base-image CVE,
# say).
#
# Why Docker Hub, when publish.yml pushes to GHCR. Production cannot reach
# ghcr.io at all — it is filtered at the network layer on that host, unrelated
# to credentials — so the image production pulls has to live on Docker Hub.
# publish.yml's GHCR output remains, but for the café-laptop self-update flow
# only (src/lib/app-update.ts defaults GHCR_IMAGE to that repository and mints
# short-lived GHCR pull tokens for it); it is not what production runs.
# The package this pushes to is private
# (DOCKERHUB_USERNAME/cafe-restaurant-pos on Docker Hub, created private
# manually — Docker Hub auto-creates on first push as public otherwise),
# matching docs/server-sync.md ("this is a closed-source product"). Do not
# make it public, and do not switch this workflow to GHCR.
#
# Tag shape is load-bearing: `sha-<short>` plus `latest`, matching
# imageRefFor() in src/lib/app-update-status.ts. GIT_SHA is passed as a build
# arg because the Dockerfile bakes it into APP_IMAGE_SHA, which is how a
# running container knows which build it is.
#
# The image is gated, not blind: `gates` re-runs the static half of the local
# checklist (type check, production build) on the exact merge commit before
# anything is pushed. The test suites stay in the manual test.yml — they need
# a service container and several minutes, and that workflow stays manual by
# design (CLAUDE.md's CI section).
#
# The final step redeploys production through the Coolify API
# (COOLIFY_API_TOKEN, a repo secret with the "deploy" ability). `latest=true`
# is load-bearing: production's compose entry for this image sets no
# pull_policy, so a plain restart would reuse the stale cached image —
# latest=true forces the pull regardless.
name: build and push image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # Rebuild and redeploy without a new commit (a base-image CVE, say).
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cafe-restaurant-pos
  # Session signing is not what's under test here, but `next build` does not
  # read .env and needs a real (non-placeholder) secret to prerender.
  # Throwaway, CI-only, never used to sign anything real.
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef

jobs:
  gates:
    name: pre-deploy gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  build-and-push:
    name: build and push (Docker Hub)
    runs-on: ubuntu-latest
    needs: [gates]
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy
        run: |
          curl -sf -X POST \
            "https://manage.eshobe.com/api/v1/services/jrfpvt0rctfkmzpw1ao5c1cb/restart?latest=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
