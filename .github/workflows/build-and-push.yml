# Builds the production image and publishes it to Docker Hub — the missing half
# of the Runflare-builds-from-source deployment described in
# docs/server-migration.md. Two things this unlocks, once production is
# repointed at the pushed tag instead of building from the Dockerfile itself:
#
#   1. Deploys become "pull a prebuilt image" instead of "build the whole app
#      from scratch on the hosting platform" — the actual slow part of a
#      deploy (npm ci + next build over ~1,500 source files) moves onto
#      GitHub's runners, which get real layer caching (cache-from/cache-to:
#      type=gha below), and the platform side is just a fast pull + restart.
#   2. It's what src/lib/app-update.ts / scripts/check-app-update.ts already
#      expect but have never had: a real
#      docker.io/<DOCKERHUB_USERNAME>/cafe-restaurant-pos:sha-<short-sha> tag
#      for the commit you dispatch against, which the café-laptop self-update
#      flow polls for. That feature has been shipped but dark — this is what
#      turns it on.
#
# Deliberately its own workflow, not folded into test.yml: that workflow's
# whole point (see its own header comment and CLAUDE.md's CI section) is to
# stay a test-only gate. Manual only — does not run on push, pull request,
# merge, or after `test` completes. Start it from the Actions tab
# (workflow_dispatch) when you want an image published. Run `test` first
# yourself; nothing here re-checks that.
#
# NOTE: this workflow alone does not change what production runs. Runflare
# still builds from source per docs/server-migration.md until its service is
# repointed at this image — that's a separate, deliberate step.
#
# Pushed to Docker Hub, not GHCR: srv1.eshobe.com (a deploy target for this
# image, see archive/deploy/docker-compose.srv1.yml) cannot reach ghcr.io at
# all — it's blocked at the network layer on that host, unrelated to
# credentials. Docker Hub is reachable from there, so that's what any
# server-side puller needs regardless of which platform builds/pushes here.
# The package this pushes to is private (DOCKERHUB_USERNAME/cafe-restaurant-pos
# on Docker Hub, created private manually — Docker Hub auto-creates on first
# push as public otherwise), matching docs/server-sync.md ("this is a
# closed-source product").
name: build and push image

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cafe-restaurant-pos

jobs:
  build-and-push:
    name: build and push (Docker Hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
