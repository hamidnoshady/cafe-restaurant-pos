# Checks the parts of the platform that ship to a customer's machine but that
# `test.yml` never touches: the production container, Electron desktop shell,
# WordPress plugin, and the PowerShell that runs on a cafe PC.
#
# Why this is separate from `test.yml`: none of it is `src/`. `test.yml` runs
# tsc, vitest and `next build` over the web app, so a syntax error in
# `electron/main.js`, a BOM in a plugin PHP file, or a version bumped in two of
# its three required places is invisible there — and the *first* time anyone
# finds out is when the installer fails to launch on a cafe PC or WordPress
# refuses the zip. These checks are seconds long and catch exactly that class
# of breakage.
#
# Triggers: `workflow_dispatch` (run it by hand before either release build),
# plus `pull_request` and `push` to `main`, scoped with `paths:` to only the
# files this workflow actually checks (`Dockerfile`, `electron/`, desktop build
# scripts, `public/windows/`, `wordpress-plugin/`). It remains active whenever
# production application code or one of those shipped surfaces changes.
#
# It deliberately does not publish or retain release artifacts. It performs a
# no-push production-container build; `.exe` packaging remains in
# `build-desktop-installer.yml`, and plugin zip publishing remains separate.
name: verify-shippables

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'src/**'
      - 'migrations/**'
      - 'scripts/build-desktop-runtime.mjs'
      - 'scripts/verify-packaged-electron-runtime.ps1'
      - 'scripts/desktop/**'
      - 'server.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'public/windows/**'
      - 'wordpress-plugin/**'
      - '.github/workflows/verify-shippables.yml'
  # GitHub suppresses PR-synchronize events created by the Arena GitHub App.
  # Keep shipped-runtime checks active on those branch pushes as well.
  push:
    branches: [main, 'arena/**']
    paths:
      - 'electron/**'
      - 'src/**'
      - 'migrations/**'
      - 'scripts/build-desktop-runtime.mjs'
      - 'scripts/verify-packaged-electron-runtime.ps1'
      - 'scripts/desktop/**'
      - 'server.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'public/windows/**'
      - 'wordpress-plugin/**'
      - '.github/workflows/verify-shippables.yml'

# Keep PR and Arena-push groups distinct. Cancelling the fallback run leaves
# cancelled check contexts attached to the same review commit.
concurrency:
  group: verify-shippables-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Windows PowerShell 5.1 — always present on Windows, unlike `pwsh`.
    shell: powershell

jobs:
  container:
    name: production container
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the production image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: business-suite:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            NODE_OPTIONS=--max-old-space-size=3072
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert supported production Node.js and required runtime tools
        run: |
          set -euo pipefail
          version="$(docker run --rm --entrypoint node business-suite:ci --version)"
          case "$version" in
            v24.*) ;;
            *) echo "Production image must carry Node.js 24.x, found $version" >&2; exit 1 ;;
          esac
          docker run --rm --entrypoint sh business-suite:ci -c '
            test -x ./node_modules/.bin/tsx &&
            command -v chromium-browser >/dev/null &&
            command -v pg_dump >/dev/null &&
            command -v pg_restore >/dev/null
          '
          echo "Production image Node.js: $version"

  desktop:
    name: desktop shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci

      - name: Stage explicit development PostgreSQL-tools status
        run: npm run desktop:stage-pg-tools

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Desktop production posture tests
        run: npx vitest run src/lib/desktop-runtime-posture.test.ts src/lib/desktop-network-interfaces.test.ts src/lib/chromium-executable.test.ts

      - name: Build production app and staged desktop runtime
        env:
          JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef
        run: |
          npm run build
          npm run desktop:runtime

      - name: Install Electron dependencies for this platform
        working-directory: electron
        run: npm ci --ignore-scripts

      - name: Audit Electron production dependencies
        working-directory: electron
        run: npm audit --omit=dev --audit-level=high

      - name: Electron sources parse
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem electron -Recurse -File -Filter *.js |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($f.FullName) does not parse" }
          }

      - name: New positive runtime constraints hold
        working-directory: electron
        run: npm run verify:runtime

      - name: Staged runtime stays below pre-package budget
        run: |
          $bytes = (Get-ChildItem .desktop-runtime -Recurse -File | Measure-Object Length -Sum).Sum
          $mib = [math]::Round($bytes / 1MB, 1)
          Write-Host "staged desktop runtime: $mib MiB"
          if ($bytes -gt 200MB) { throw "Staged runtime $mib MiB exceeds 200 MiB budget" }

  plugin:
    name: WordPress plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # WordPress reads the version from three places and they must agree:
      # the `Version:` header (what the plugins screen shows), the
      # POS_CONNECTOR_VERSION constant (what the update check compares), and
      # readme.txt's `Stable tag`. build-plugin-zip.yml bumps all three; a
      # hand-edit that misses one ships a plugin that never offers its update.
      - name: Plugin version is consistent across all three places
        run: |
          $ErrorActionPreference = "Stop"
          $root   = "wordpress-plugin/pos-accounting-connector"
          $php    = [IO.File]::ReadAllText((Resolve-Path "$root/pos-accounting-connector.php"))
          $readme = [IO.File]::ReadAllText((Resolve-Path "$root/readme.txt"))

          $header = [regex]::Match($php,    '\*\s*Version:\s*([0-9.]+)').Groups[1].Value
          $const  = [regex]::Match($php,    "define\( 'POS_CONNECTOR_VERSION', '([^']+)' \)").Groups[1].Value
          $stable = [regex]::Match($readme, 'Stable tag:\s*([0-9.]+)').Groups[1].Value

          Write-Host "header=$header const=$const stable=$stable"
          if (-not $header -or -not $const -or -not $stable) {
            Write-Host "::error::could not read all three version fields"; exit 1
          }
          if ($header -ne $const -or $const -ne $stable) {
            Write-Host "::error::plugin version mismatch - header=$header, POS_CONNECTOR_VERSION=$const, Stable tag=$stable. All three must agree."
            exit 1
          }
          if ($readme -notmatch [regex]::Escape("= $const =")) {
            Write-Host "::error::readme.txt has no changelog entry for $const."
            exit 1
          }
          Write-Host "plugin version $const is consistent and documented"

      # A UTF-8 BOM is invisible in an editor and fatal in WordPress: PHP emits
      # those bytes before WordPress sends its headers, so the site dies with
      # "headers already sent". The plugin is full of Persian text, so it is
      # genuinely easy for an editor to add one.
      - name: No BOM in plugin sources
        run: |
          $ErrorActionPreference = "Stop"
          $bad = @()
          # Filter the extension after a LiteralPath traversal. PowerShell's
          # `-Include` has surprising wildcard rules and once matched nothing
          # here; the count assertion below is the backstop for that whole
          # class of mistake.
          $scanned = 0
          foreach ($f in Get-ChildItem -LiteralPath "wordpress-plugin" -Recurse -File | Where-Object { $_.Extension -in @(".php", ".txt") }) {
            $scanned++
            $bytes = [IO.File]::ReadAllBytes($f.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              $bad += $f.FullName
            }
          }
          if ($bad.Count -gt 0) {
            Write-Host "::error::UTF-8 BOM found (WordPress will report 'headers already sent'): $($bad -join ', ')"
            exit 1
          }
          if ($scanned -eq 0) {
            Write-Host "::error::the BOM check matched no files at all - the glob is wrong, so this check was proving nothing."
            exit 1
          }
          Write-Host "no BOM in $scanned files"

      # Only runs where PHP exists. Skipped rather than failed, so the job is
      # useful on a machine without PHP installed.
      - name: PHP syntax (skipped when PHP is not installed)
        run: |
          $php = Get-Command php -ErrorAction SilentlyContinue
          if (-not $php) {
            Write-Host "::notice::PHP is not installed on this runner - skipping the syntax check. Install PHP to enable it."
            exit 0
          }
          $failed = $false
          foreach ($f in Get-ChildItem -Path wordpress-plugin -Recurse -File -Filter *.php) {
            php -l $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { Write-Host "::error::PHP syntax errors above"; exit 1 }

      # The zip is assembled the same way build-plugin-zip.yml assembles it, so
      # a packaging problem surfaces here instead of halfway through a release
      # that has already committed and tagged a version bump.
      - name: The release zip would be well-formed
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $pluginDir = Resolve-Path "wordpress-plugin/pos-accounting-connector"
          $zipPath   = Join-Path $env:RUNNER_TEMP "plugin-shape-check.zip"
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }

          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($f in Get-ChildItem -LiteralPath $pluginDir -Recurse -File | Where-Object { $_.Name -ne ".DS_Store" }) {
              $rel = $f.FullName.Substring($pluginDir.Path.Length).TrimStart("\", "/").Replace("\", "/")
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $f.FullName, "pos-accounting-connector/$rel") | Out-Null
            }
          } finally { $zip.Dispose() }

          $check = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = $check.Entries | ForEach-Object { $_.FullName }
            if ($names -notcontains "pos-accounting-connector/pos-accounting-connector.php") {
              Write-Host "::error::the plugin's main file would be missing from the zip"; exit 1
            }
            # WordPress's unzipper treats a backslash as part of the filename,
            # which installs the plugin as one flat file.
            $backslashed = $names | Where-Object { $_.Contains("\") }
            if ($backslashed) { Write-Host "::error::zip entries contain backslashes: $($backslashed -join ', ')"; exit 1 }
            Write-Host "zip shape ok: $($names.Count) entries, all under pos-accounting-connector/"
          } finally {
            $check.Dispose()
            Remove-Item -LiteralPath $zipPath -Force
          }

  connector:
    name: Windows print connector
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Parse both the customer-installed connector and packaged-runtime gate.
      # A syntax failure in either would otherwise surface late in acceptance.
      # Parsing is done without running a single line.
      - name: PowerShell scripts parse
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "public/windows/cafe-pos-print-connector.ps1",
            "scripts/verify-packaged-electron-runtime.ps1"
          )
          $failed = $false
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f)) {
              Write-Host "::error::$f is missing from the shipped Windows tooling set."
              $failed = $true
              continue
            }
            $tokens = $null; $errors = $null
            # ParseFile takes a [string]; Resolve-Path returns a PathInfo, so
            # take its .Path rather than relying on coercion.
            $full = (Resolve-Path -LiteralPath $f).Path
            [System.Management.Automation.Language.Parser]::ParseFile(
              $full, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host "ok  $f"
            }
          }
          if ($failed) { exit 1 }
