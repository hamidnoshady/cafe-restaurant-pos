# Builds the standalone Windows desktop installer (the Business Suite `.exe`).
#
# This is deliberately separate from `test.yml`: producing an installer is
# slow (electron-builder downloads Electron, packs a ~1 GB payload and
# compresses an NSIS archive), and nothing about an unrelated pull request
# needs it. It now runs automatically, but only when the desktop shell is
# actually being worked on — `pull_request` and `push` to `main` are scoped
# with `paths:` to `electron/**` and `windows/**`, so a PR that never touches
# those folders never pays this cost. `workflow_dispatch` still exists for a
# manual, versioned release build (the `version` input below only applies
# there — the automatic runs never bump `electron/package.json`'s version).
#
# It can only run on Windows: electron-builder produces the NSIS installer with
# Windows-only tooling (`rcedit` stamps the icon and version onto the exe), so
# the job runs on the GitHub-hosted `windows-latest` runner.
#
# The build order matters and is not obvious: `electron/package.json` lists the
# repository's `../.next`, `../src`, `../node_modules` and friends under
# `extraResources`, so the **root Next.js app must be built first** and the root
# `node_modules` must exist. A packaged app whose `.next` is missing or stale
# fails at launch, not at build time.
#
# Full background, including the packaging constraints that will re-break this:
# docs/standalone-desktop-app.md
name: build-desktop-installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (X.Y.Z). Leave empty to keep electron/package.json as-is.'
        type: string
        required: false
  pull_request:
    paths:
      - 'electron/**'
      - 'windows/**'
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'windows/**'

# Manual (`workflow_dispatch`) runs are a release action and queue on a single
# global group — an installer is a release artifact, so a queued run is
# cheaper than sorting out which of two concurrent ones to ship. Automatic PR
# builds get their own per-ref group instead, so two unrelated PRs (or a new
# push superseding an old one on the same PR) don't queue behind each other.
concurrency:
  group: build-desktop-installer-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

defaults:
  run:
    shell: powershell

env:
  NODE_OPTIONS: --max-old-space-size=3072
  # `next build` does not read .env, and the build imports modules that refuse a
  # placeholder secret. Throwaway, build-only — the installed app generates its
  # own real secret on first launch (electron/main.js).
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef

jobs:
  build:
    name: package the Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set the installer version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version must be X.Y.Z, got '$env:VERSION'."
            exit 1
          }
          $path = "electron/package.json"
          # Rewritten as text rather than via ConvertTo-Json: that would reorder
          # and reformat the whole manifest, including the large `build` block.
          $json = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          # The instance overload is the one that takes a replacement *count*;
          # the static [regex]::Replace's fourth argument is RegexOptions, so
          # passing 1 there would mean IgnoreCase and rewrite every "version"
          # key in the file — including the ones inside the `build` block.
          $rx = New-Object System.Text.RegularExpressions.Regex '("version"\s*:\s*")[^"]+(")'
          $updated = $rx.Replace($json, "`${1}$env:VERSION`${2}", 1)
          if ($updated -eq $json) {
            Write-Error "Could not find a version field in $path."
            exit 1
          }
          [IO.File]::WriteAllText((Resolve-Path $path), $updated)
          Write-Host "electron/package.json version -> $env:VERSION"

      # extraResources pulls ../node_modules and ../.next into the payload, so
      # the root app has to be installed and built before packaging.
      - name: Install root dependencies
        run: npm ci

      - name: Build the Next.js app
        run: npm run build

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      # `predist` (scripts/prepare-wincodesign-cache.js) runs automatically here
      # and works around electron-builder's winCodeSign extraction failure on a
      # non-elevated Windows account without Developer Mode.
      - name: Build the installer
        working-directory: electron
        run: npm run dist

      - name: Locate the installer
        id: artifact
        run: |
          $ErrorActionPreference = "Stop"
          # Windows PowerShell 5.1's `Out-File -Encoding utf8` writes a UTF-8
          # BOM, and the runner parses these files byte-for-byte: a BOM ends up
          # inside the first key name, so `steps.<id>.outputs.<key>` silently
          # resolves to empty. Append BOM-free bytes instead.
          function Add-GitHubOutput([string]$line) {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$line`n", (New-Object System.Text.UTF8Encoding($false)))
          }
          $exe = Get-ChildItem -Path electron/dist -Filter *.exe -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error "electron-builder produced no .exe in electron/dist. If it failed while packing the NSIS archive, check docs/standalone-desktop-app.md — the win-unpacked/ folder can exist even when the installer does not."
            exit 1
          }
          $sizeMb = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "installer: $($exe.Name) ($sizeMb MB)"
          Add-GitHubOutput "name=$($exe.Name)"
          Add-GitHubOutput "size=$sizeMb"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: business-suite-desktop-installer
          path: electron/dist/*.exe
          if-no-files-found: error

      - name: Tell the human what to do next
        env:
          NAME: ${{ steps.artifact.outputs.name }}
          SIZE: ${{ steps.artifact.outputs.size }}
        run: |
          @"
          ## Desktop installer built

          **$env:NAME** ($env:SIZE MB)

          1. Download **business-suite-desktop-installer** from this run's artifacts.
          2. Give the ``.exe`` to the cafe PC and double-click it — nothing else needs installing.

          The installer is **unsigned**, so Windows SmartScreen warns that the publisher is
          unknown on first run. That is expected until a code-signing certificate exists
          (see docs/standalone-desktop-app.md).
          "@ | ForEach-Object {
            # BOM-free, like GITHUB_OUTPUT above — the summary is rendered as
            # markdown and a BOM shows up as a stray glyph before the heading.
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$_`n", (New-Object System.Text.UTF8Encoding($false)))
          }
