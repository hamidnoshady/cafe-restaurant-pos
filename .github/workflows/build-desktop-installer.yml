name: build-desktop-installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (X.Y.Z); empty keeps electron/package.json'
        type: string
        required: false
  pull_request:
    paths:
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'scripts/build-desktop-runtime.mjs'
      - 'scripts/report-desktop-size.mjs'
      - 'scripts/desktop/**'
      - 'server.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-desktop-installer.yml'
  # Arena agent branches use a GitHub App whose PR-synchronize events may be
  # suppressed by GitHub. Run on those pushes as well so a Windows package is
  # still tested before review; concurrency cancels the duplicate if a PR event
  # is emitted too.
  push:
    branches: [main, 'arena/**']
    paths:
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'scripts/build-desktop-runtime.mjs'
      - 'scripts/report-desktop-size.mjs'
      - 'scripts/desktop/**'
      - 'server.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-desktop-installer.yml'

concurrency:
  group: build-desktop-installer-${{ github.event_name == 'workflow_dispatch' && 'release' || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

defaults:
  run:
    shell: powershell

env:
  NODE_OPTIONS: --max-old-space-size=4096
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef

jobs:
  build:
    name: packaged Windows end-to-end
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set installer version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be X.Y.Z" }
          npm pkg set "version=$env:VERSION" --prefix electron

      - name: Install application dependencies
        run: npm ci

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Security posture unit tests
        run: npx vitest run src/lib/desktop-runtime-posture.test.ts src/lib/desktop-network-interfaces.test.ts src/lib/chromium-executable.test.ts

      - name: Build Next production application
        run: npm run build

      - name: Build positively selected desktop runtime
        run: npm run desktop:runtime

      - name: Install Electron production/build dependencies
        working-directory: electron
        run: npm ci

      - name: Audit Electron production dependencies
        working-directory: electron
        run: npm audit --omit=dev --audit-level=high

      - name: Verify staged runtime and canonical icon
        working-directory: electron
        run: npm run verify:runtime

      - name: Pre-package size report
        run: node scripts/report-desktop-size.mjs --output=desktop-size-before-package.md

      - name: Build NSIS installer and win-unpacked runtime
        working-directory: electron
        run: npm run dist

      - name: Assert one Windows PostgreSQL payload and no foreign payload
        run: |
          $root = "electron/dist/win-unpacked"
          $postgres = @(Get-ChildItem $root -Recurse -File -Filter postgres.exe)
          $initdb = @(Get-ChildItem $root -Recurse -File -Filter initdb.exe)
          if ($postgres.Count -ne 1) { throw "Expected exactly one postgres.exe, found $($postgres.Count)" }
          if ($initdb.Count -ne 1) { throw "Expected exactly one initdb.exe, found $($initdb.Count)" }
          $foreign = @(Get-ChildItem $root -Recurse -Directory | Where-Object { $_.FullName -match '@embedded-postgres[\\/](linux|darwin)-' })
          if ($foreign.Count) { throw "Foreign PostgreSQL payload found: $($foreign.FullName -join ', ')" }
          $rootModules = Get-ChildItem "$root/resources/desktop-runtime/node_modules" -ErrorAction Stop
          if (Test-Path "$root/resources/desktop-runtime/node_modules/typescript") { throw "TypeScript leaked into runtime" }
          if (Test-Path "$root/resources/desktop-runtime/.next/cache") { throw ".next/cache leaked into runtime" }
          Write-Host "PostgreSQL payload: $($postgres[0].FullName)"

      - name: Run actual packaged desktop twice with clean user data
        working-directory: electron
        run: node scripts/smoke-packaged.js

      - name: Final size report and budgets
        id: sizes
        run: |
          node scripts/report-desktop-size.mjs --output=desktop-size-report.md
          $exe = Get-ChildItem electron/dist -File -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer missing" }
          $unpacked = (Get-ChildItem electron/dist/win-unpacked -Recurse -File | Measure-Object Length -Sum).Sum
          $installerMiB = [math]::Round($exe.Length / 1MB, 1)
          $installedMiB = [math]::Round($unpacked / 1MB, 1)
          "installer=$installerMiB" >> $env:GITHUB_OUTPUT
          "installed=$installedMiB" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          if ($exe.Length -gt 350MB) { throw "Installer $installerMiB MiB exceeds 350 MiB budget" }
          if ($unpacked -gt 600MB) { throw "Installed payload $installedMiB MiB exceeds 600 MiB budget" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: business-suite-desktop-installer
          path: electron/dist/*.exe
          if-no-files-found: error

      - name: Upload desktop size reports
        uses: actions/upload-artifact@v4
        with:
          name: business-suite-desktop-size-report
          path: |
            desktop-size-before-package.md
            desktop-size-report.md
          if-no-files-found: error

      - name: Job summary
        env:
          NAME: ${{ steps.sizes.outputs.name }}
          INSTALLER: ${{ steps.sizes.outputs.installer }}
          INSTALLED: ${{ steps.sizes.outputs.installed }}
        run: |
          @"
          ## Business Suite Windows package

          - Installer: **$env:NAME** — **$env:INSTALLER MiB**
          - Unpacked installed payload: **$env:INSTALLED MiB**
          - Runtime: Next standalone trace + bundled custom server; no root node_modules
          - Acceptance: packaged executable initialized PostgreSQL UTF-8, migrated, passed RLS boot, bootstrapped through the real API, authenticated, stopped, restarted and retained data
          "@ >> $env:GITHUB_STEP_SUMMARY
