name: Build desktop installer

# Builds the standalone Windows installer (electron/ — no Docker, no
# Docker Desktop, a bundled real PostgreSQL 16 via embedded-postgres). See
# docs/standalone-desktop-app.md.
#
# Runs on windows-latest specifically so electron-builder produces a native
# Windows build (including the correct @embedded-postgres/windows-x64
# binary) without needing cross-compilation or a personal Windows machine.
#
# Manual (workflow_dispatch) or on a release tag — unlike deploy.yml this
# doesn't need to run on every push to main: the installer is only worth
# rebuilding when you actually intend to hand out a new one.

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build-windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build the Next.js app
        run: npm run build
        env:
          # Same placeholder the Dockerfile uses: only needs to be *set* to
          # satisfy the prod env check, never used at runtime (the desktop
          # app generates and persists its own real secret on first launch —
          # see electron/main.js).
          JWT_SECRET: build-time-placeholder-not-used-at-runtime

      # The desktop bundle copies the app's whole node_modules (electron/main.js
      # runs server.ts/scripts via the bundled tsx, which needs the runtime
      # dependency tree present) — but build-only tooling that's never
      # require()'d at runtime (server.ts only calls into "next" and "tsx";
      # see server.ts and electron/main.js) doesn't need to ride along. Removing
      # it shrinks the installer, which is what actions/upload-artifact stores
      # against the repo's Actions/Packages storage quota.
      - name: Prune build-only tooling before packaging
        shell: bash
        run: |
          rm -rf node_modules/typescript node_modules/vitest node_modules/tailwindcss \
                 node_modules/@tailwindcss node_modules/@types

      - name: Install desktop app dependencies
        working-directory: electron
        run: npm install

      - name: Build the Windows installer
        working-directory: electron
        run: npm run dist

      - name: Upload installer artifact
        # continue-on-error: a storage-quota rejection here (transient — GitHub
        # only recalculates freed quota every 6-12 hours after a cleanup) must
        # not skip the release-publish step below, since that step doesn't
        # touch the same quota and would otherwise succeed anyway.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cafe-pos-windows-installer
          path: electron/dist/*.exe
          if-no-files-found: error
          # Short-lived: this is a convenience download for manual
          # (workflow_dispatch) builds. Actions-artifact storage shares the
          # same quota as GHCR image storage, so don't let it linger for the
          # 90-day default. Tagged releases get a permanent copy below.
          retention-days: 3

      - name: Publish installer to the GitHub Release
        # Only tag pushes (v*) represent an actual release; workflow_dispatch
        # runs are ad-hoc builds and only get the artifact above. Release
        # assets don't count against the Actions/Packages storage quota, so
        # this is the durable distribution path (see docs/standalone-desktop-app.md),
        # and it must run even if the artifact upload above was quota-rejected.
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.exe
