# Production stack for srv1.eshobe.com.
#
# Differs from docker-compose.komodo.yml, which targets a conventional Traefik
# that owns 443 and issues its own certificates. On this host:
#   - DirectAdmin/OpenLiteSpeed owns 80/443 and terminates TLS (Let's Encrypt).
#   - It reverse-proxies the subdomain to Traefik on 127.0.0.1:8090.
#   - Traefik runs network_mode: host with the *file* provider only, so
#     container labels are never read — routing for this app lives in Traefik's
#     dynamic.yml, not here.
#
# The image is built by GitHub Actions and pulled from GHCR rather than built
# here: the server cannot clone from GitHub (its git links against
# libcurl-gnutls, whose TLS handshake is filtered upstream), and building a
# Next.js app on the same machine as the live customer sites is best avoided.
#
# NOTE: Komodo holds the operative copy of this file in the stack's Environment
# /compose configuration, because it cannot fetch from git either. This file is
# the version-controlled reference — if you edit it, update the Komodo stack too.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pos}
    volumes:
      - pos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    # Deliberately not published to the host: only the app reaches it.

  app:
    image: ghcr.io/hamidnoshady/cafe-restaurant-pos:${POS_IMAGE_TAG:-latest}
    # Without this a redeploy would happily reuse the cached :latest and the
    # new build would never actually go live.
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Superuser on purpose: docker-entrypoint.sh migrates with this, then
      # provisions a restricted pos_app role from it and launches the server
      # with that instead — the process never actually runs as this role. See
      # scripts/derive-runtime-database-url.ts and the README's tenancy section.
      DATABASE_URL: postgres://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pos}
      # MUST be a real secret. Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      BACKUP_DIR: /app/backups
    # Loopback only. This host runs live customer sites on 80/443 via
    # OpenLiteSpeed; binding 0.0.0.0 here would expose the POS directly and
    # bypass the TLS front door. Traefik connects to 127.0.0.1:${POS_HOST_PORT}.
    ports:
      - "127.0.0.1:${POS_HOST_PORT:-3000}:3000"
    volumes:
      - pos-backups:/app/backups
    networks:
      - internal

volumes:
  pos-pgdata:
  pos-backups:

networks:
  internal:
