# Production stack for Komodo + Traefik.
#
# Runs the POS app together with its own Postgres 16, and publishes the app
# through an existing Traefik reverse proxy (TLS terminated at Traefik). The
# app container is NOT published to the host — Traefik reaches it over the
# shared external network, so the only way in is your HTTPS subdomain.
#
# Usage in Komodo (Stack / Compose):
#   1. Point the stack at this repo + this compose file.
#   2. Provide the variables below via the stack's Environment (see
#      .env.komodo.example). At minimum: POS_DOMAIN, JWT_SECRET,
#      POSTGRES_PASSWORD, TRAEFIK_NETWORK, TRAEFIK_CERTRESOLVER.
#   3. Deploy. The app's entrypoint waits for Postgres and runs migrations
#      automatically on first boot and every subsequent deploy.
#
# Full walkthrough: docs/deployment-local-network.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pos}
    volumes:
      - pos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    # Not published to the host — only the app (same internal network) talks to it.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Superuser on purpose: docker-entrypoint.sh migrates with this, then
      # provisions a restricted pos_app role from it and launches the server
      # with that instead — the process never actually runs as this role. See
      # scripts/derive-runtime-database-url.ts and the README's tenancy section.
      DATABASE_URL: postgres://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pos}
      # MUST be a real secret. Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      # Phase 21: this stack IS the central server — sites sync to it and it
      # syncs to nothing, so the Server Sync tab drops the connection form and
      # PUT /api/server-sync/config refuses. Declared rather than left to the
      # POS_DOMAIN inference so the answer doesn't change if that moves.
      DEPLOYMENT_ROLE: central
      # Scheduled backups (Phase 10) land here; the volume below keeps them.
      BACKUP_DIR: /app/backups
      # Biometric login (Phase 20 Wave 3). Derived from POS_DOMAIN (Traefik
      # always terminates this stack over HTTPS — see tls.certresolver
      # below) so it's never left at webauthn.ts's "localhost" defaults,
      # which would make every WebAuthn ceremony fail on the real domain.
      WEBAUTHN_RP_ID: ${POS_DOMAIN:?set POS_DOMAIN}
      WEBAUTHN_ORIGIN: https://${POS_DOMAIN:?set POS_DOMAIN}
      # Phase 21 — per-business origins. ROOT_DOMAIN is the zone every business
      # subdomain hangs off; SUBDOMAIN_ROUTING is the switch, left off until the
      # wildcard certificate is confirmed issuing (see .env.komodo.example).
      ROOT_DOMAIN: ${ROOT_DOMAIN:?set ROOT_DOMAIN}
      SUBDOMAIN_ROUTING: ${SUBDOMAIN_ROUTING:-off}
      PLATFORM_BASE_URL: https://${POS_DOMAIN:?set POS_DOMAIN}
    volumes:
      - pos-backups:/app/backups
    networks:
      - internal
      - traefik
    labels:
      traefik.enable: "true"
      # Which Docker network Traefik should use to reach this service.
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      # Phase 21 — three routers, ONE container. Every business is served from
      # its own origin ({subdomain}.${ROOT_DOMAIN}), but a new business must
      # not require a new deployment: the wildcard router below matches any
      # single label, and the app resolves which business it is from the Host
      # header. Adding a café is a database row, not a redeploy.
      #
      #   pos       — every business subdomain (wildcard)
      #   pos-admin — the super-admin console's own host
      #   pos-apex  — the bare domain, a "which business?" router
      #
      # Priorities are explicit because HostRegexp would otherwise also match
      # `admin.`: the more specific Host() rules must win.
      traefik.http.routers.pos.rule: HostRegexp(`^[a-z0-9-]+\.${ROOT_DOMAIN:?set ROOT_DOMAIN}$`)
      traefik.http.routers.pos.priority: "10"
      traefik.http.routers.pos.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.pos.tls: "true"
      # DNS-01 is not optional here: Let's Encrypt will not issue a wildcard
      # over HTTP-01, so TRAEFIK_CERTRESOLVER must name a resolver configured
      # with a DNS provider credential for ${ROOT_DOMAIN}.
      traefik.http.routers.pos.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER}
      traefik.http.routers.pos.tls.domains[0].main: ${ROOT_DOMAIN:?set ROOT_DOMAIN}
      traefik.http.routers.pos.tls.domains[0].sans: "*.${ROOT_DOMAIN:?set ROOT_DOMAIN}"

      traefik.http.routers.pos-admin.rule: Host(`admin.${ROOT_DOMAIN:?set ROOT_DOMAIN}`)
      traefik.http.routers.pos-admin.priority: "20"
      traefik.http.routers.pos-admin.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.pos-admin.tls: "true"
      traefik.http.routers.pos-admin.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER}

      traefik.http.routers.pos-apex.rule: Host(`${ROOT_DOMAIN:?set ROOT_DOMAIN}`)
      traefik.http.routers.pos-apex.priority: "20"
      traefik.http.routers.pos-apex.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.pos-apex.tls: "true"
      traefik.http.routers.pos-apex.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER}

      # The app (Next.js + /ws WebSocket) listens on 3000. Traefik forwards the
      # WebSocket upgrade automatically — no extra config needed for live sync,
      # and the wildcard router changes nothing about that (see
      # docs/deployment-local-network.md).
      traefik.http.services.pos.loadbalancer.server.port: "3000"

volumes:
  pos-pgdata:
  pos-backups:

networks:
  # Private network between app and db (not reachable from outside the stack).
  internal:
  # Traefik's existing network, created outside this stack. Set its real name
  # in TRAEFIK_NETWORK (Komodo's Traefik commonly uses "traefik").
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
