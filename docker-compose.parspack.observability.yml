# Optional OpenObserve overlay for the ParsPack stack. Entirely optional: the
# app behaves identically with none of this — no OPENOBSERVE_* env, no extra
# container, the «پایش» tab just shows a setup guide instead of live data.
# See docs/openobserve.md for what it buys you and docs/parspack-deployment.md
# for how it fits ParsPack specifically.
#
# Usage, if ParsPack's Docker Compose app accepts a compose command with
# multiple -f files:
#   docker compose -f docker-compose.parspack.yml -f docker-compose.parspack.observability.yml up -d
#
# If the ParsPack panel only takes a single compose file, merge this file's
# `observability` service and the `app.environment`/`app.depends_on` additions
# below into docker-compose.parspack.yml by hand before creating the app —
# there's nothing ParsPack-specific in the merge itself.
#
# Unlike docker-compose.observability.yml (which targets Traefik) this overlay
# has no reverse-proxy labels: ParsPack is the front door here too (same
# reasoning as TRUST_FORWARDED_HOST in docker-compose.parspack.yml). If you
# want the OpenObserve UI reachable from outside for dashboards/alerts, attach
# a ParsPack domain to this service directly and set OPENOBSERVE_PUBLIC_URL to
# it; the POS app itself never needs that URL to be public — it only ever
# talks to the collector over the internal network.

services:
  observability:
    image: public.ecr.aws/zinclabs/openobserve:${OPENOBSERVE_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Root pair is read on first boot only; rotate it in the OpenObserve UI
      # afterwards if you like — this env var stays the recovery credential.
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:?set OPENOBSERVE_ROOT_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?set OPENOBSERVE_ROOT_PASSWORD}
      ZO_DATA_DIR: /data
      ZO_COMPACT_DATA_RETENTION_DAYS: ${OPENOBSERVE_RETENTION_DAYS:-60}
      ZO_COMPACT_LOCAL_STORAGE: "true"
    volumes:
      - zo-data:/data
    networks:
      - internal
    # Confirm (as with pos-backups/pos-pgdata) that ParsPack persists named
    # volumes across redeploys — otherwise this container's log history is
    # wiped on every deploy of the app.

  app:
    environment:
      OPENOBSERVE_URL: http://observability:5080
      OPENOBSERVE_USER: ${OPENOBSERVE_ROOT_EMAIL}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      OPENOBSERVE_LOG_STREAM: ${OPENOBSERVE_LOG_STREAM:-pos_app_logs}
      OPENOBSERVE_SERVICE: ${OPENOBSERVE_SERVICE:-pos-parspack}
      OPENOBSERVE_ENV: ${OPENOBSERVE_ENV:-production}
      OPENOBSERVE_PUBLIC_URL: ${OPENOBSERVE_PUBLIC_URL:-}
    depends_on:
      # Soft dependency on purpose: an observability outage must never block
      # the POS from booting. The shipper just counts drops until it returns.
      observability:
        condition: service_started

volumes:
  zo-data:
