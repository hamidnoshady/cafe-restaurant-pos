version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.19
    working_directory: ~/repo

jobs:
  test:
    docker:
      - image: cimg/node:20.19
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
    working_directory: ~/repo
    environment:
      DATABASE_URL: postgres://pos:pos@localhost:5432/pos
      JWT_SECRET: ci-test-secret
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Wait for Postgres
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Run migrations
          command: npm run db:migrate
      - run:
          name: Type check
          command: npx tsc --noEmit
      - run:
          name: Unit tests
          command: npm test

  build:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Production build
          command: npm run build
          environment:
            DATABASE_URL: postgres://pos:pos@localhost:5432/pos
            JWT_SECRET: ci-build-secret

workflows:
  build-and-test:
    jobs:
      - test
      - build
